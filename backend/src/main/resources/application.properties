# Smart Campus Operations Hub — Application Properties

spring.application.name=smart-campus-hub
server.port=8080


# ─── MongoDB ──────────────────────────────────────────────────────────────────
spring.data.mongodb.uri={mongodb://localhost:27017/smartcampusdb}
spring.data.mongodb.auto-index-creation=true


# ─── File Upload ────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB


# ─── CORS ───────────────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:3000


# ─── OAuth2 Google (Member 4) ─────────────────────────────────────────────────
spring.security.oauth2.client.registration.google.client-id={GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret={GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/oauth2/callback/{registrationId}

# ─── JWT (Member 4) ───────────────────────────────────────────────────────────
jwt.secret={JWT_SECRET_KEY}
jwt.expiration={   JWT_EXPIRATION_TIME_IN_MS}


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username={MAIL_USERNAME}
spring.mail.password={MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true