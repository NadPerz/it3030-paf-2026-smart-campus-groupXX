# Smart Campus Operations Hub — Application Properties

spring.application.name=smart-campus-hub
server.port=8080


# ─── MongoDB ──────────────────────────────────────────────────────────────────
spring.data.mongodb.uri=mongodb+srv://smart_campus_dev:team1243@cluster0.upmvcxn.mongodb.net/smart_campus?retryWrites=true&w=majority&appName=Cluster0
spring.data.mongodb.auto-index-creation=true


# ─── File Upload ────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB


# ─── CORS ───────────────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:3000


# ─── OAuth2 Google (Member 4) ─────────────────────────────────────────────────
